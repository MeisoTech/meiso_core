name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      legacy:
        description: Run historical Composition checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-debug
            runner: ubuntu-24.04
            compiler: gcc
            build_type: Debug
            c_flags: ""
            linker_flags: ""
          - name: appleclang-release
            runner: macos-15
            compiler: clang
            build_type: Release
            c_flags: ""
            linker_flags: ""
          - name: clang-asan-ubsan
            runner: ubuntu-24.04
            compiler: clang
            build_type: Debug
            c_flags: >-
              -fsanitize=address,undefined
              -fno-omit-frame-pointer
              -fno-sanitize-recover=all
            linker_flags: -fsanitize=address,undefined
    env:
      CC: ${{ matrix.compiler }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Markdown links
        if: matrix.name == 'gcc-debug'
        run: python3 devtools/check_markdown_links.py

      - name: Install desktop decoder dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libavcodec-dev libavutil-dev libswscale-dev libjpeg-dev libdrm-dev

      - name: Configure
        run: |
          cmake -S . -B "build/${{ matrix.name }}" \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DCMAKE_C_FLAGS="${{ matrix.c_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}" \
            -DMEISO_BUILD_DESKTOP_EDGE=${{ runner.os == 'Linux' && 'ON' || 'OFF' }} \
            -DMEISO_BUILD_LEGACY_COMPOSITION=${{ inputs.legacy && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build "build/${{ matrix.name }}" --parallel 2

      - name: Run native test suite
        run: >-
          ctest --test-dir "build/${{ matrix.name }}"
          --output-on-failure
          --no-tests=error
          --timeout 180

  k230d:
    name: K230D product cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Same compiler identity as the BSP lock; official vendor mirror.
      XUANTIE_URL: https://kendryte-download.canaan-creative.com/k230/downloads/dl/gcc/Xuantie-900-gcc-linux-6.6.0-glibc-x86_64-V3.0.2-20250410.tar.gz
      XUANTIE_SHA256: 2215e1ffe1b9b9277b1f5af2f61102e83973163404f29b04da7097fdafa9e1b7
      # Minimal sysroot extension built from upstream source (Buildroot 2025.02.1 hashes).
      LIBDRM_URL: https://dri.freedesktop.org/libdrm/libdrm-2.4.124.tar.xz
      LIBDRM_SHA256: ac36293f61ca4aafaf4b16a2a7afff312aa4f5c37c9fbd797de9e3c0863ca379
      JPEG_URL: https://www.ijg.org/files/jpegsrc.v9f.tar.gz
      JPEG_SHA256: 04705c110cb2469caa79fb71fba3d7bf834914706e9641a4589485c1f832565b
    steps:
      - name: Check out exact product revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Match the revision built manually; do not embed a synthetic merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config
          python3 -m venv build/ci-tools
          build/ci-tools/bin/pip install meson==1.7.2
          echo "$PWD/build/ci-tools/bin" >> "$GITHUB_PATH"

      - name: Cross-build and check K230dVideoRuntime installation
        run: .github/scripts/k230d-cross.sh

      - name: Show build logs on failure
        if: failure()
        run: tail -n 80 build/k230d-ci/*.log

      - name: Retain product binaries and reproducibility manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: K230dVideoRuntime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/k230d-ci/K230dVideoRuntime.tar.gz
            build/k230d-ci/SHA256SUMS
            build/k230d-ci/build-info.txt
          if-no-files-found: error
          retention-days: 14
