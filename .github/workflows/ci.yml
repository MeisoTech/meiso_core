name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      legacy:
        description: Run historical Composition checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-debug
            runner: ubuntu-24.04
            compiler: gcc
            build_type: Debug
            c_flags: ""
            linker_flags: ""
          - name: appleclang-release
            runner: macos-15
            compiler: clang
            build_type: Release
            c_flags: ""
            linker_flags: ""
          - name: clang-asan-ubsan
            runner: ubuntu-24.04
            compiler: clang
            build_type: Debug
            c_flags: >-
              -fsanitize=address,undefined
              -fno-omit-frame-pointer
              -fno-sanitize-recover=all
            linker_flags: -fsanitize=address,undefined
    env:
      CC: ${{ matrix.compiler }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Markdown links
        if: matrix.name == 'gcc-debug'
        run: python3 devtools/check_markdown_links.py

      - name: Configure
        run: |
          cmake -S . -B "build/${{ matrix.name }}" \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DCMAKE_C_FLAGS="${{ matrix.c_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}" \
            -DMEISO_BUILD_LEGACY_COMPOSITION=${{ inputs.legacy && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build "build/${{ matrix.name }}" --parallel 2

      - name: Run native test suite
        run: >-
          ctest --test-dir "build/${{ matrix.name }}"
          --output-on-failure
          --no-tests=error
          --timeout 180

  # The desktop Edge and the K230D product cross-build moved to meiso_edge with the
  # Edge sources (S-027); its CI builds them against this repository's locked revision.
